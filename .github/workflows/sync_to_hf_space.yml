# GitHub'a her Push'ta kodu Hugging Face Space'e de gönderir.
# Gerekenler (GitHub repo → Settings → Secrets and variables → Actions):
#   Secret   HF_TOKEN  = Hugging Face "Write" token
#   Variable HF_SPACE  = kullanici-adi/space-adi   (ör. ahmetycsy/skin-cds)
# Model dosyaları ve veri gönderilmez (.gitignore'da oldukları için repoda da yoklar).
name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "huggingface_hub>=0.25"
      - name: Upload to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              folder_path=".",
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              commit_message=f"GitHub {os.environ.get('GITHUB_SHA', '')[:7]}",
              ignore_patterns=[".git/*", ".github/*", ".devcontainer/*", "kaggle/*", "models/*.pt", "models/*.pth"],
              delete_patterns=["*"],  # Space'te artik olmayan dosyalar silinir; yuklenenler yeniden eklenir
          )
          PY
